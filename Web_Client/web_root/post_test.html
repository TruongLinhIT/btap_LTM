<html>
<head>
    <title>Kiểm Thử HTTP POST - Google Web Client</title>
</head>
<body bgcolor="#F8F9FA" text="#202124" link="#1A73E8">
<table width="88%" cellpadding="16" cellspacing="0" border="1" bordercolor="#DADCE0" bgcolor="#FFFFFF" align="center">
    <tr bgcolor="#E8F0FE">
        <td>
            <font face="Arial" size="4" color="#1967D2"><b>CÔNG CỤ GỬI BIỂU MẪU HTTP POST TRÊN TRÌNH DUYỆT</b></font><br>
            <font face="Arial" size="2" color="#5F6368">Khi bấm Gửi, trình duyệt sẽ đóng gói bản tin <code>POST /api/submit HTTP/1.1</code> kèm <code>Content-Length</code> và gửi qua Socket TCP.</font>
        </td>
    </tr>
    <tr>
        <td>
            <form action="/api/submit" method="POST">
                <font face="Arial" size="2"><b>1. Họ và tên sinh viên:</b></font><br>
                <input type="text" name="hoten" value="Nguyen Van A" size="45"><br><br>

                <font face="Arial" size="2"><b>2. Mã số sinh viên:</b></font><br>
                <input type="text" name="masv" value="21IT001" size="45"><br><br>

                <font face="Arial" size="2"><b>3. Lớp học phần:</b></font><br>
                <input type="text" name="lop" value="Lap Trinh Mang - Web Client" size="45"><br><br>

                <font face="Arial" size="2"><b>4. Nội dung thông điệp POST:</b></font><br>
                <input type="text" name="noidung" value="Kiem thu phuong thuc HTTP POST tren trinh duyet" size="55"><br><br>

                <input type="submit" value="  🚀 Gửi Dữ Liệu Lên Server (HTTP POST)  ">
            </form>
            <br>
            <hr size="1" color="#E0E0E0">
            <a href="/"><font face="Arial" size="2"><b>&larr; Quay về Trang chủ Google</b></font></a>
        </td>
    </tr>
</table>
</body>
</html>
