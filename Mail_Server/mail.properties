# LTM Mail Server Configuration (SMTP + POP3 + MySQL + Gmail Gateway)
# Cấu hình tự động kết nối container ltm-mysql (Port 3308) và phpMyAdmin (Port 8085)

# Cấu hình máy chủ
mail.domain=localhost
smtp.port=2525
pop3.port=1100
max.clients=50

# Cấu hình kết nối MySQL (Container ltm-mysql ở thư mục LTM)
db.host=localhost
db.port=3308
db.name=mail_db
db.user=root
db.pass=root123

# Cấu hình chuyển tiếp (Relay) và lấy thư từ Gmail
gmail.enabled=false
gmail.user=
gmail.app_password=
gmail.smtp.host=smtp.gmail.com
gmail.smtp.port=465
gmail.pop3.host=pop.gmail.com
gmail.pop3.port=995
gmail.fetch.enabled=true
gmail.fetch.interval_seconds=60
gmail.fetch.initial_count=10
gmail.fetch.default_user=admin
